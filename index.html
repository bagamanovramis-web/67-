<!DOCTYPE html>
<html>
    <head>
        <title>Кликер Пипа</title>
        <link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>ПИПА КЛИКЕР</h1>
        <p>КЛИКАЙ НА ПИПУ</p>
        <button onclick="clickButton()">
            <img src="button_transparent.png">
        </button>
        <h2 id="score">
            0
        </h2>
        <button id="resetButton" onclick="resetClicks()">
            Сбросить клики
        </button>
        <button id="soundButton" onclick="toggleSound()">
            Звук: Вкл.
        </button>
        <div class="version">
            Pipa Clicker v0.4
        </div>
    </body>
</html>
